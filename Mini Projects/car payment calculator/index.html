<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Payment Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #result {
            font-weight: bold;
            /* max-width: 300px;
            transform: translateX(452px);
            line-height: 3; */
        }
    </style>
</head>
<body>

    <h1>Car Payment Calculator</h1>

    <label for="carPrice">Car Price:</label>
    <input type="number" id="carPrice" placeholder="Enter car price" required>
    <br>

    <button onclick="calculatePayment()">Calculate Payments</button>

    <h2 id="result"></h2>

    <script>
        function calculatePayment() {
            // Get car price from input
            const carPrice = parseFloat(document.getElementById('carPrice').value);

            // Calculate down payment (10% of car price)
            const downPayment = carPrice / 5;

            const remainingPrice = carPrice - downPayment;

            const monthlyInterestRate = 0.00583;

            const monthsNumber = 72;

            const top = remainingPrice * monthlyInterestRate;

            const toThePowerOf = monthsNumber * -1;

            const bottom = 1 - (1 + monthlyInterestRate)** toThePowerOf;

            const equation = top/bottom;

            const monthlyPayment = equation * 0.7;

            const income = monthlyPayment * 4.5;


            var date;
            if (income >= 1000 && income <= 6000) {
                date = '2025/8/1';
            } else if (income > 6000 && income <= 10000) {
                date = '2026/3/1';
            } else {
                date = '2027/1/1';
            }

            // Calculate months left
            var currentDate = new Date();
            var targetDate = new Date(date);
            var monthsLeft = Math.ceil((targetDate - currentDate) / (30 * 24 * 60 * 60 * 1000));

            var weeksLeft = monthsLeft * 4;

            // Calculate days left (months left * 30)
            var daysLeft = monthsLeft * 30;

            var birthdate = new Date('2006/6/1');

// Calculate age based on the date variable
            var age = Math.floor((targetDate - birthdate) / (365.25 * 24 * 60 * 60 * 1000));


            // Display results
            var resultElement = document.getElementById('result');
            resultElement.innerHTML = `
                <p>Down Payment: ${downPayment.toFixed(2)} JOD</p>
                <p>Monthly Payment: ${monthlyPayment.toFixed(2)} JOD</p>
                <p>Income: ${income.toFixed(2)} JOD</p>
                <p>Date: ${date}</p>
                <p>Months Left: ${monthsLeft} months</p>
                <p>Weeks Left: ${weeksLeft} weeks</p>
                <p>Days Left: ${daysLeft} days</p>
                 <p>Age: ${age} years</p>
            `;
        }

        
    </script>

</body>
</html>
