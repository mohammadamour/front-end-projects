<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,600;1,700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Ping coming soon page</title>

  
</head>
<body>
     
     
     <div class="container">
       <img class="logo" src="images/logo.svg" alt="the ping logo">
     
        <h1>We are launching <span>soon!</span></h1>

        <p>Subscribe and get notified</p>
     
     <form  action="/" class="inputs">
         <input  type="email" placeholder="Your email address">
         <button type="submit" class="notify">Notify Me</button>
     </form>
         <p id="error" class="error hidden">Please provide a valid email address</p>

  
     <img class="main-img" src="images/illustration-dashboard.png" alt="illustration-dashboard and the main image in the page">


     <div class="social">
        <img src="images/icon-facebook.svg" alt="a social media app icon">
        <img src="images/icon-instagram.svg" alt="a social media app icon">
        <img src="images/icon-twitter.svg" alt="a social media app icon">
     </div>

     </div>
     
    
     <div class="attribution">
       Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
       Coded by <a href="https://mohammadsvioan.github.io/my-updated-website/">mohammad alteab</a>.
     </div>

     <script src="main.js"></script>
</body>
</html>
