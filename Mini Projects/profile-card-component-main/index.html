<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Profile card component</title>

</head>
<body>
 
  <div class="container">
    <img class="bg" src="images/bg-pattern-card.svg" alt="">
    <img class="top-img" src="images/bg-pattern-top.svg" alt="">
      <div class="img">
        <img class="main-img" src="images/image-victor.jpg" alt="my image">
      </div>
    
      <div class="center">
        <p class="name">
        Mohammad altaeb
      </p>

      <!-- <p class="num">
        26
      </p> -->

      <p class="country">
      Jordan
      </p>
      </div>
      
      <hr>

      <siv class="bottom">
        <div class="first-div">
        <h4>80K</h4>
        <p>Followers</p>
      </div>
    
    
        <div class="sec-div">
           <h4>803K <br></h4>
           <p>Likes <br></p>
        </div>
    
    
      <div class="third-div">
          <h4>1.4K</h4>
          <p>Photos</p>
      </div>
    </siv>
  <img class="bottom-img" src="images/bg-pattern-bottom.svg" alt="">
  </div>
  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">mohammad altaeb</a>.
  </div> -->
</body>
</html>
